name: Run linting

on:
  pull_request:
    branches:
      - master
      - develop_backends

jobs:
  linting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: ruff check
        if: success() || failure()
        uses: pre-commit/action@v3.0.1
        with:
          extra_args: ruff-check --all-files

      - name: ruff format
        if: success() || failure()
        uses: pre-commit/action@v3.0.1
        with:
          extra_args: ruff-format --all-files

      - name: ty
        if: success() || failure()
        uses: pre-commit/action@v3.0.1
        with:
          extra_args: ty --all-files
