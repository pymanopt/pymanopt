name: Build documentation

on:
  pull_request:
    branches:
      - master
      - develop_backends
  push:
    branches:
      - master
      - develop_backends

concurrency:
  group: docs-deploy
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc
          uv sync --all-extras

      - name: Run doctests
        run: uv run sphinx-build -b doctest docs $(mktemp -d)

      - name: Build stable docs
        run: |
          uv run sphinx-build \
            -b html \
            -D doc_version="stable" \
            -D doc_versions="stable,latest" \
            docs \
            website/docs/stable

      - name: Build latest docs
        run: |
          uv run sphinx-build \
            -b html \
            -D doc_version="latest" \
            -D doc_versions="stable,latest" \
            docs \
            website/docs/latest

      - name: Stage documentation
        if: ${{ github.ref == 'refs/heads/master' }}
        run: |
          mkdir -p /tmp/pages/docs
          cp -r website/index.html website/css website/static \
            website/site.webmanifest website/favicon.ico \
            website/.nojekyll website/CNAME /tmp/pages/
          cp -r website/docs/stable /tmp/pages/docs/
          cp -r website/docs/latest /tmp/pages/docs/

      - name: Upload pages artifact
        if: ${{ github.ref == 'refs/heads/master' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/pages

  deploy:
    if: ${{ github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
