name: Build documentation

on:
  pull_request:
    branches:
      - master
      - develop_backends
  push:
    branches:
      - master
      - develop_backends

jobs:
  build-matrix:
    runs-on: ubuntu-latest
    steps:
      - name: Generate version matrix
        id: build-matrix
        run: echo "versions=['stable', 'latest']" >> "$GITHUB_OUTPUT"
    outputs:
      versions: ${{ steps.build-matrix.outputs.versions }}

  docs:
    runs-on: ubuntu-latest
    needs: build-matrix
    strategy:
      # Make sure we never build docs in parallel in case we deploy new
      # versions to avoid potential race conditions while pushing to gh pages.
      max-parallel: 1
      matrix:
        version: ${{ fromJSON(needs.build-matrix.outputs.versions) }}
    steps:
      - name: Clone repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Determine python version
        id: python-version
        run: |
          if ${{ matrix.version == 'stable' }}; then
            echo "version=3.11" >> "$GITHUB_OUTPUT"
          else
            echo "version=3.14" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.python-version.outputs.version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          python-version: ${{ steps.python-version.outputs.version }}
          enable-cache: true

      - name: Clone repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Checkout target
        id: checkout
        run: git checkout ${{ github.sha }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc
          if ${{ matrix.version == 'stable' }}; then
            uv sync --extra autograd --extra tensorflow --extra torch --extra dev --extra ci --extra docs
          else
            uv sync --all-extras
          fi

      - name: Run doctests
        run: uv run sphinx-build -b doctest docs $(mktemp -d)

      - name: Build docs
        run: |
          uv run sphinx-build \
            -b html \
            -D doc_version="${{ matrix.version }}" \
            -D doc_versions="${{ join(fromJSON(needs.build-matrix.outputs.versions)) }}" \
            docs \
            website/docs/${{ matrix.version }}

      - name: Publish documentation
        if: ${{ github.ref == 'refs/heads/master' }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.ACTIONS_DEPLOY_KEY }}
          external_repository: pymanopt/pymanopt.github.io
          publish_branch: main
          publish_dir: website/docs/${{ matrix.version }}
          destination_dir: docs/${{ matrix.version }}
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
          commit_message: ${{ github.event.head_commit.message }}
