[build-system]
requires = ["pip==26.2", "setuptools>=66.1.0", "setuptools-scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "pymanopt"
dynamic = ["version"]
description = """\
  Toolbox for optimization on Riemannian manifolds with support for automatic \
  differentiation\
"""
authors = [
    { name = "Jamie Townsend" },
    { name = "Niklas Koep" },
    { name = "Sebastian Weichwald" },
]
readme = "README.md"
license = { text = "BSD 3-Clause License" }
requires-python = ">=3.11,<3.16"
keywords = ["manifolds", "optimization", "automatic differentiation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: BSD License",
    "Intended Audience :: Science/Research",
    "Development Status :: 5 - Production/Stable",
]
dependencies = [
    "numpy>=2,<3",
    "scipy>=1.13,<2",
    "packaging",
]
[project.urls]
homepage = "https://pymanopt.org"

[project.optional-dependencies]
autograd = ["autograd>=1.2"]
jax = ["jax>=0.2.0", "jaxlib"]
tensorflow = ["tensorflow>=2.0.0"]
torch = ["torch>=1.0.0"]
backends = ["pymanopt[autograd,jax,tensorflow,torch]"]
dev = [
    "matplotlib",
    "pre-commit",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
]
docs = [
    "docutils==0.21.2",
    "ipykernel==6.30.1",
    "myst-parser==4.0.1",
    "nbsphinx==0.9.7",
    "sphinx==8.1.3",
    "sphinx_rtd_theme==3.0.2",
    "sphinxcontrib-katex==0.8.6",
]
ci = ["build==0.8.0", "pip==26.2", "setuptools==83.0.0", "wheel==0.38.4"]
all = ["pymanopt[backends,dev]"]

[tool.setuptools_scm]
write_to = "src/pymanopt/_version.py"

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["tests*"]

[tool.pyright]
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 79
extend-exclude = ["src/pymanopt/_version.py"]

[tool.ruff.lint]
select = [
    "B",  # flake8-bugbear
    "C4",  # flake8-comprehensions
    "D",  # pydocstyle
    "E",  # pycodestyle errors
    "F",  # pyflakes
    "I",  # isort
    "W",  # pycodestyle warnings
]
ignore = [
    "B024",  # abstract base class without abstract methods
    "B027",  # abstract method without annotation in abstract base class
    "B905",  # zip() without explicit strict parameter
    "D1",  # missing docstrings
    "D200",  # one-line docstring should fit on one line
    "D205",  # missing blank line after docstring summary
    "D212",  # multi-line docstring summary should start at the first line
    "D411",  # missing blank line before docstring section
    "D415",  # docstring first line should end with a period
    "D417",  # missing argument description in docstring
    "E203",  # whitespace before punctuation (black/ruff-format compat)
    "E402",  # module import not at top of file (notebook-derived examples)
    "E501",  # line too long
]

[tool.ruff.lint.per-file-ignores]
"docs/conf.py" = ["E231"]
"examples/*.py" = ["F811"]
"src/pymanopt/optimizers/conjugate_gradient.py" = ["E231"]
"src/pymanopt/optimizers/optimizer.py" = ["E231"]
"src/pymanopt/optimizers/nelder_mead.py" = ["E231"]
"src/pymanopt/optimizers/trust_regions.py" = ["E221", "E231"]
"src/pymanopt/tools/diagnostics.py" = ["E231"]
"src/pymanopt/tools/printer.py" = ["E231"]

[tool.ruff.lint.isort]
known-first-party = ["pymanopt"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ty.src]
include = ["src", "tests"]
exclude = ["src/pymanopt/_version.py"]

[tool.ty.rules]
# Gradual adoption: start relaxed, tighten per rule once resolved.
# - empty-body / invalid-method-override: abstract backend stubs (`def f(...) -> T: ...`)
# - unresolved-import: optional backend imports (torch, tensorflow) not installed in the lint env
# - not-subscriptable / unresolved-attribute / invalid-argument-type: Optional-typed
#   optimizer log and numpy-protocol interplay, needs real fixes before tightening
# - ambiguous-protocol-member: backend.array_t protocol defines helper aliases in its body
empty-body = "ignore"
unresolved-import = "ignore"
not-subscriptable = "ignore"
unresolved-attribute = "ignore"
invalid-argument-type = "ignore"
invalid-method-override = "ignore"
ambiguous-protocol-member = "ignore"
# Stale blanket `# type: ignore` directives tolerated by pyright/mypy but flagged
# by ty; removing them is a separate cleanup.
unused-type-ignore-comment = "ignore"
# numpy-protocol interplay in backend arithmetic (`array_t` union types);
# needs typed-protocol rework before tightening.
unsupported-operator = "ignore"
invalid-return-type = "ignore"
invalid-attribute-override = "ignore"
invalid-property-type-override = "ignore"
no-matching-overload = "ignore"

# tests/test_problem.py asserts the runtime AttributeError guard on
# attribute assignment; ty's static view of it is a spurious error.
[[tool.ty.overrides]]
include = ["tests/test_problem.py"]
[tool.ty.overrides.rules]
invalid-assignment = "ignore"
